<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .swimlane-header { font-size: 16px; font-weight: bold; fill: #FFFFFF; }
      .process-title { font-size: 14px; font-weight: 600; fill: #FFFFFF; }
      .step-text { font-size: 13px; fill: #333333; font-weight: 500; }
      .doc-item { font-size: 12px; fill: #FFFFFF; }
      .connector-line { stroke: #2E5090; stroke-width: 2.5; fill: none; }
      .arrow { fill: #2E5090; }
      .swimlane-bg { fill: #F8F9FA; stroke: #D0D7DE; stroke-width: 1; }
      .swimlane-divider { stroke: #D0D7DE; stroke-width: 2; fill: none; }
      .decision-box { stroke: #FF9800; stroke-width: 2.5; fill: #FFE8CC; }
      .decision-text { font-size: 14px; font-weight: 600; fill: #333333; }
      .start-end-box { fill: #9E9E9E; stroke: #616161; stroke-width: 2; }
      .action-blue-box { fill: #1976D2; stroke: #0D47A1; stroke-width: 2; }
      .action-purple-box { fill: #7B1FA2; stroke: #4A148C; stroke-width: 2; }
      .action-green-box { fill: #388E3C; stroke: #1B5E20; stroke-width: 2; }
      .action-red-box { fill: #D32F2F; stroke: #B71C1C; stroke-width: 2; }
      .shadow { filter: drop-shadow(2px 2px 6px rgba(0,0,0,0.15)); }
      .title-text { font-size: 32px; font-weight: bold; fill: #1A3A52; }
      .decision-label { font-size: 13px; font-weight: 600; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" class="arrow" />
    </marker>
    <marker id="arrowhead-yes" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4CAF50" />
    </marker>
    <marker id="arrowhead-no" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#D32F2F" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1000" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="700" y="45" text-anchor="middle" class="title-text">
    TPA Compliance Review Flowchart - Swimlane Process
  </text>

  <!-- Swimlane Container -->
  <g id="swimlanes">
    <!-- Swimlane 1: Initiator -->
    <rect x="50" y="80" width="150" height="880" class="swimlane-bg"/>
    <rect x="50" y="80" width="150" height="60" fill="#1A3A52"/>
    <text x="125" y="115" text-anchor="middle" class="swimlane-header">Initiator</text>

    <!-- Swimlane 2: System -->
    <rect x="200" y="80" width="300" height="880" class="swimlane-bg"/>
    <rect x="200" y="80" width="300" height="60" fill="#1976D2"/>
    <text x="350" y="115" text-anchor="middle" class="swimlane-header">System</text>

    <!-- Swimlane 3: Processing -->
    <rect x="500" y="80" width="300" height="880" class="swimlane-bg"/>
    <rect x="500" y="80" width="300" height="60" fill="#7B1FA2"/>
    <text x="650" y="115" text-anchor="middle" class="swimlane-header">Processing Engine</text>

    <!-- Swimlane 4: Decision -->
    <rect x="800" y="80" width="250" height="880" class="swimlane-bg"/>
    <rect x="800" y="80" width="250" height="60" fill="#FF9800"/>
    <text x="925" y="115" text-anchor="middle" class="swimlane-header">Validation</text>

    <!-- Swimlane 5: Outcome -->
    <rect x="1050" y="80" width="300" height="880" class="swimlane-bg"/>
    <rect x="1050" y="80" width="300" height="60" fill="#4CAF50"/>
    <text x="1200" y="115" text-anchor="middle" class="swimlane-header">Outcome</text>

    <!-- Swimlane Dividers -->
    <line x1="200" y1="80" x2="200" y2="960" class="swimlane-divider"/>
    <line x1="500" y1="80" x2="500" y2="960" class="swimlane-divider"/>
    <line x1="800" y1="80" x2="800" y2="960" class="swimlane-divider"/>
    <line x1="1050" y1="80" x2="1050" y2="960" class="swimlane-divider"/>
  </g>

  <!-- Process Flow -->
  <g id="flow">
    <!-- Step 1: TPA Record Exists -->
    <rect x="75" y="180" width="100" height="65" rx="5" class="start-end-box shadow"/>
    <text x="125" y="218" text-anchor="middle" class="process-title">TPA Record</text>
    <text x="125" y="238" text-anchor="middle" class="process-title">Exists</text>

    <!-- Connector 1 -->
    <line x1="125" y1="245" x2="125" y2="285" class="connector-line" marker-end="url(#arrowhead)"/>

    <!-- Step 2: Initiate Compliance Review -->
    <rect x="235" y="285" width="230" height="65" rx="5" class="action-blue-box shadow"/>
    <text x="350" y="323" text-anchor="middle" class="process-title">Initiate Compliance Review</text>

    <!-- Connector 2 -->
    <line x1="350" y1="350" x2="350" y2="390" class="connector-line" marker-end="url(#arrowhead)"/>

    <!-- Step 3: System Displays All Required Documents -->
    <rect x="235" y="390" width="230" height="120" rx="5" class="action-purple-box shadow"/>
    <text x="350" y="410" text-anchor="middle" class="process-title">System Displays All</text>
    <text x="350" y="430" text-anchor="middle" class="process-title">Required Documents</text>
    <text x="350" y="450" text-anchor="middle" style="font-size: 11px; fill: #FFFFFF; font-weight: 500;">
      • Signed Agreement
    </text>
    <text x="350" y="468" text-anchor="middle" style="font-size: 11px; fill: #FFFFFF; font-weight: 500;">
      • Banking Details Verification
    </text>
    <text x="350" y="486" text-anchor="middle" style="font-size: 11px; fill: #FFFFFF; font-weight: 500;">
      • Tax Compliance Status
    </text>
    <text x="350" y="504" text-anchor="middle" style="font-size: 11px; fill: #FFFFFF; font-weight: 500;">
      • Registration Certificates
    </text>

    <!-- Connector 3 -->
    <line x1="350" y1="510" x2="350" y2="550" class="connector-line" marker-end="url(#arrowhead)"/>

    <!-- Step 4: System Fetches & Displays Status -->
    <rect x="235" y="550" width="230" height="80" rx="5" class="action-blue-box shadow"/>
    <text x="350" y="575" text-anchor="middle" class="process-title">System Fetches &</text>
    <text x="350" y="595" text-anchor="middle" class="process-title">Displays Status</text>
    <text x="350" y="620" text-anchor="middle" style="font-size: 11px; fill: #FFFFFF; font-weight: 500;">
      for Each Document
    </text>

    <!-- Connector 4 -->
    <line x1="350" y1="630" x2="350" y2="670" class="connector-line" marker-end="url(#arrowhead)"/>

    <!-- Step 5: Decision - Is Status "Approved"? -->
    <polygon points="650,710 750,650 850,710 750,770" class="decision-box shadow"/>
    <text x="750" y="705" text-anchor="middle" class="decision-text">Is Status</text>
    <text x="750" y="725" text-anchor="middle" class="decision-text">"Approved"?</text>

    <!-- YES Path -->
    <line x1="650" y1="710" x2="570" y2="710" class="connector-line" marker-end="url(#arrowhead-yes)" stroke="#4CAF50"/>
    <text x="600" y="700" text-anchor="middle" style="font-size: 13px; font-weight: bold; fill: #4CAF50;">Yes</text>

    <!-- Step 6a: Mark Document as Compliant (YES path) -->
    <rect x="470" y="670" width="180" height="80" rx="5" class="action-green-box shadow"/>
    <text x="560" y="695" text-anchor="middle" class="process-title">Mark Document</text>
    <text x="560" y="715" text-anchor="middle" class="process-title">as Compliant</text>
    <text x="560" y="740" text-anchor="middle" style="font-size: 11px; fill: #FFFFFF; font-weight: 500;">✓ Approved</text>

    <!-- Connector to completion -->
    <line x1="560" y1="750" x2="560" y2="790" class="connector-line" marker-end="url(#arrowhead)" stroke="#4CAF50"/>

    <!-- NO Path -->
    <line x1="850" y1="710" x2="930" y2="710" class="connector-line" marker-end="url(#arrowhead-no)" stroke="#D32F2F"/>
    <text x="885" y="700" text-anchor="middle" style="font-size: 13px; font-weight: bold; fill: #D32F2F;">No</text>

    <!-- Step 6b: Clearly Flag as Outstanding/Action Required (NO path) -->
    <rect x="930" y="650" width="180" height="120" rx="5" class="action-red-box shadow"/>
    <text x="1020" y="675" text-anchor="middle" class="process-title">Clearly Flag as</text>
    <text x="1020" y="695" text-anchor="middle" class="process-title">Outstanding/</text>
    <text x="1020" y="715" text-anchor="middle" class="process-title">Action Required</text>
    <text x="1020" y="740" text-anchor="middle" style="font-size: 11px; fill: #FFFFFF; font-weight: 500;">⚠ Pending Review</text>

    <!-- Connector to completion -->
    <line x1="1020" y1="770" x2="1020" y2="810" class="connector-line" marker-end="url(#arrowhead)" stroke="#D32F2F"/>

    <!-- Final merge point -->
    <line x1="560" y1="790" x2="1020" y2="790" class="connector-line" marker-end="url(#arrowhead)"/>
    <line x1="1020" y1="810" x2="1020" y2="850" class="connector-line" marker-end="url(#arrowhead)"/>

    <!-- Step 7: End State - Compliance Review Complete -->
    <rect x="960" y="850" width="120" height="70" rx="5" class="start-end-box shadow"/>
    <text x="1020" y="872" text-anchor="middle" class="process-title">Review</text>
    <text x="1020" y="892" text-anchor="middle" class="process-title">Complete</text>
  </g>

  <!-- Legend -->
  <g id="legend" transform="translate(100, 880)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#1A202C">Legend:</text>
    
    <rect x="0" y="15" width="20" height="20" rx="3" class="start-end-box"/>
    <text x="28" y="30" font-size="12" fill="#333">Start/End</text>

    <rect x="100" y="15" width="20" height="20" rx="3" class="action-blue-box"/>
    <text x="128" y="30" font-size="12" fill="#333">System Action</text>

    <rect x="250" y="15" width="20" height="20" rx="3" class="action-purple-box"/>
    <text x="278" y="30" font-size="12" fill="#333">Processing</text>

    <polygon points="375,25 385,15 395,25 385,35" class="decision-box"/>
    <text x="403" y="30" font-size="12" fill="#333">Decision</text>

    <rect x="500" y="15" width="20" height="20" rx="3" class="action-green-box"/>
    <text x="528" y="30" font-size="12" fill="#333">Approved Path</text>

    <rect x="650" y="15" width="20" height="20" rx="3" class="action-red-box"/>
    <text x="678" y="30" font-size="12" fill="#333">Outstanding Path</text>
  </g>

  <!-- Footer -->
  <text x="700" y="970" font-size="12" text-anchor="middle" fill="#666666">
    Production-Ready Process Diagram | TPA Compliance Review with 5-Lane Swimlane Architecture
  </text>
</svg>